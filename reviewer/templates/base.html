{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Code Reviewer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css">
    <!-- CodeMirror Dracula Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            background: #f5f7fb;
            transition: 0.3s;
        }

        body.dark-mode {

            background: #121212;
            color: white;

        }

        body.dark-mode .card {

            background: #1f1f1f;
            color: white;
            border: 1px solid #333;

        }

        body.dark-mode .card-header {

            border-bottom: 1px solid #444;

        }

        body.dark-mode .table {

            color: white;

        }

        body.dark-mode .table-bordered {

            border-color: #444;

        }

        body.dark-mode .table td,
        body.dark-mode .table th {

            border-color: #444;

        }

        body.dark-mode .table-hover tbody tr:hover {

            background: #2d2d2d;

        }

        body.dark-mode textarea,
        body.dark-mode input,
        body.dark-mode select {

            background: #2b2b2b;
            color: white;
            border: 1px solid #555;

        }

        body.dark-mode .form-control {

            background: #2b2b2b;
            color: white;

        }

        body.dark-mode .navbar {

            background: #000 !important;

        }

        body.dark-mode small {

            color: #bbb !important;

        }

        body.dark-mode label {

            color: white;

        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
               Python Code Reviewer
            </a>

            <button id="themeToggle" class="btn btn-outline-light ms-auto">

                🌙 Dark Mode

            </button>

        </div>

    </nav>

    <div class="container mt-5">

        {% block content %}
        {% endblock %}

    </div>


    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

    <!-- Python support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>


    {% block scripts %}
    {% endblock %}

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const body = document.body;
            const themeToggle = document.getElementById("themeToggle");

            // Load saved theme

            const savedTheme = localStorage.getItem("theme");

            if (savedTheme === "dark") {

                body.classList.add("dark-mode");
                themeToggle.innerHTML = "☀️ Light Mode";

            }
            else {

                themeToggle.innerHTML = "🌙 Dark Mode";

            }

            // Toggle

            themeToggle.addEventListener("click", function () {

                body.classList.toggle("dark-mode");

                if (body.classList.contains("dark-mode")) {

                    localStorage.setItem("theme", "dark");
                    themeToggle.innerHTML = "☀️ Light Mode";

                }
                else {

                    localStorage.setItem("theme", "light");
                    themeToggle.innerHTML = "🌙 Dark Mode";

                }

                // Change CodeMirror theme

                if (window.editor) {

                    editor.setOption(
                        "theme",
                        body.classList.contains("dark-mode")
                            ? "dracula"
                            : "default"
                    );

                }

            });

        });

    </script>

</body>

</html>
